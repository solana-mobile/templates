# Applied by a maintainer to a PR that was opened without an accepted issue.
needs-issue:
  prs:
    comment: >
      Hi @{issue-author},


      Thanks for the pull request! We ask that every PR references an accepted
      issue, and we couldn't find one linked here.


      The templates in this repository are deliberately small and opinionated.
      Opening an issue first lets us agree on whether a change belongs in a
      template, and in which one, before anyone spends time writing code. See
      [CONTRIBUTING.md](https://github.com/solana-mobile/templates/blob/main/CONTRIBUTING.md)
      for the full workflow.


      Please [open an issue](https://github.com/solana-mobile/templates/issues/new)
      describing the change. Once a maintainer has accepted it, you're welcome to
      reopen this PR (or open a fresh one) with `Fixes #<issue>` in the description.


      ---

      _This
      [automated message](https://github.com/solana-mobile/templates/blob/main/.github/label-actions.yml)
      is a result of having added the &lsquo;needs-issue&rsquo; label._

    # Close the pull request
    close: true
