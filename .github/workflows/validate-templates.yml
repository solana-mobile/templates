name: Validate Templates

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Template Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate metadata
        run: pnpm generate

      - name: Check generated files are up to date
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Generated files are up to date.'
            exit 0
          fi

          echo '::error::Generated files are out of date. Run "pnpm generate" and commit the result.'
          git diff --stat

          {
            echo '## Generated files are out of date'
            echo
            echo 'Run `pnpm generate` locally and commit the changes:'
            echo
            echo '```diff'
            git diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      - name: Check template repository
        run: pnpm lint
