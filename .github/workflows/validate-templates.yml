name: Validate Templates

on:
  pull_request:
    paths:
      - 'mobile/**/package.json'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate-templates.yml'
      - '.github/workflows/templates.json'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Template Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated files (templates.json, TEMPLATES.md, .github/workflows/templates.json)
      # are auto-committed by the generate-metadata.yml workflow on merge to main, so
      # contributors do not need to commit them. Regenerating before the check keeps a
      # PR from failing purely because those files are stale on the branch.
      - name: Generate metadata
        run: pnpm generate

      - name: Check template repository
        run: pnpm lint
