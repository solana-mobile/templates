name: Test Templates

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: read

jobs:
  setup-templates:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.set-matrix.outputs.templates }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # A merge group is already built on the commit it will land on; a pull request is not.
          if [[ -n "$MERGE_GROUP_BASE_SHA" ]]; then
            BASE="$MERGE_GROUP_BASE_SHA"
          else
            git fetch origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          fi
          CHANGED_FILES=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - id: set-matrix
        shell: bash
        run: |
          ALL_TEMPLATES=$(cat .github/workflows/templates.json)
          # Filter out community templates - they are maintained externally
          TESTABLE_TEMPLATES=$(echo $ALL_TEMPLATES | jq -c '[.[] | select(startswith("community/") | not)]')

          # For scheduled runs or pushes to main, test all templates (except community)
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Running all templates except community (scheduled or push to main)"
            echo templates=$(echo $TESTABLE_TEMPLATES | sed 's/ //g') | tee --append $GITHUB_OUTPUT
            exit 0
          fi

          # For PRs and merge groups, filter templates based on changed files
          if [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.event_name }}" == "merge_group" ]]; then
            CHANGED_FILES="${{ steps.changed-files.outputs.changed_files }}"

            # Check if test-related workflow or action files changed - if so, test all templates (except community)
            if echo "$CHANGED_FILES" | grep -q -E '^\.github/(actions/|workflows/test-templates\.yml)'; then
              echo "Test workflow or actions changed, testing all templates except community"
              echo templates=$(echo $TESTABLE_TEMPLATES | sed 's/ //g') | tee --append $GITHUB_OUTPUT
              exit 0
            fi

            # Extract template paths from changed files (excluding community)
            AFFECTED_TEMPLATES=$(echo "$CHANGED_FILES" | grep -E '^(kit|mobile|web3js)/' | cut -d'/' -f1-2 | sort -u || true)

            if [[ -z "$AFFECTED_TEMPLATES" ]]; then
              echo "No template files changed, skipping template tests"
              echo 'templates=[]' | tee --append $GITHUB_OUTPUT
              exit 0
            fi

            echo "Affected templates:"
            echo "$AFFECTED_TEMPLATES"

            # Filter the templates.json to only include affected templates (excluding community)
            FILTERED_TEMPLATES=$(echo "$TESTABLE_TEMPLATES" | jq -c --arg templates "$AFFECTED_TEMPLATES" '
              [.[] | select(. as $item | ($templates | split("\n") | map(. == $item) | any))]
            ')

            echo "Filtered templates: $FILTERED_TEMPLATES"
            echo templates=$(echo $FILTERED_TEMPLATES | sed 's/ //g') | tee --append $GITHUB_OUTPUT
          fi

  test-bun:
    name: Test (bun)
    runs-on: ubuntu-latest
    needs: [setup-templates]
    if: needs.setup-templates.outputs.templates != '[]'
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        template: ${{ fromJson(needs.setup-templates.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create and Build using solana-mobile create
        uses: ./.github/actions/solana-mobile-create
        with:
          cmd: 'bun x solana-mobile@latest'
          node-version: ${{ matrix.node }}
          package-manager: 'bun'
          template: ${{ matrix.template }}

  test-npm:
    name: Test (npm)
    runs-on: ubuntu-latest
    needs: [setup-templates]
    if: needs.setup-templates.outputs.templates != '[]'
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        template: ${{ fromJson(needs.setup-templates.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create and Build using solana-mobile create
        uses: ./.github/actions/solana-mobile-create
        with:
          cmd: 'npx -y solana-mobile@latest'
          node-version: ${{ matrix.node }}
          package-manager: 'npm'
          template: ${{ matrix.template }}

  test-pnpm:
    name: Test (pnpm)
    runs-on: ubuntu-latest
    needs: [setup-templates]
    if: needs.setup-templates.outputs.templates != '[]'
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        template: ${{ fromJson(needs.setup-templates.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create and Build using solana-mobile create
        uses: ./.github/actions/solana-mobile-create
        with:
          cmd: 'pnpm dlx solana-mobile@latest'
          node-version: ${{ matrix.node }}
          package-manager: 'pnpm'
          template: ${{ matrix.template }}

  test-yarn:
    name: Test (yarn)
    runs-on: ubuntu-latest
    needs: [setup-templates]
    if: needs.setup-templates.outputs.templates != '[]'
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        template: ${{ fromJson(needs.setup-templates.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create and Build using solana-mobile create
        uses: ./.github/actions/solana-mobile-create
        # Yarn Classic has no `dlx`, so launch the CLI with npx and let
        # `--package-manager yarn` drive the install inside the template.
        with:
          cmd: 'npx -y solana-mobile@latest'
          node-version: ${{ matrix.node }}
          package-manager: 'yarn'
          template: ${{ matrix.template }}

  # A single check to require in branch protection.
  #
  # The matrix jobs are named after the template they run, so their check names change from one pull
  # request to the next and a docs-only change skips them entirely. Neither can be required directly:
  # a required check that never reports blocks the pull request forever. This job always reports, and
  # fails only when something upstream actually failed or was cancelled — skipped is a pass, which is
  # what a change that touches no template should be.
  template-tests:
    name: Template tests
    runs-on: ubuntu-latest
    needs: [setup-templates, test-bun, test-npm, test-pnpm, test-yarn]
    if: always()
    steps:
      - name: Check the results of every template test job
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          echo "$NEEDS"
          if jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' <<< "$NEEDS" > /dev/null; then
            jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "::error::\(.key) reported \(.value.result)"' <<< "$NEEDS"
            exit 1
          fi
          echo 'Every template test job passed or was skipped.'
