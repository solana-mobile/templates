name: 'Run solana-mobile create'
description: 'Run solana-mobile create with the given command and template'
inputs:
  cmd:
    description: 'The command to run'
    required: true
  node-version:
    description: 'The Node.js version to use.'
    required: true
  package-manager:
    description: 'The package manager to use.'
    required: true
  template:
    description: 'The template to install'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Environment
      uses: ./.github/actions/setup
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}

    - name: Setup Java
      if: ${{ startsWith(inputs.template, 'mobile/kotlin-') }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Android SDK
      if: ${{ startsWith(inputs.template, 'mobile/kotlin-') }}
      uses: android-actions/setup-android@v4

    - name: Setup Gradle
      if: ${{ startsWith(inputs.template, 'mobile/kotlin-') }}
      uses: gradle/actions/setup-gradle@v6

    - name: Create and Build using solana-mobile create
      run: |
        cd $(mktemp -d)
        BRANCH="${{ github.head_ref || github.ref_name }}"
        REPO="${{ github.event.pull_request.head.repo.full_name || github.repository }}"
        echo "Installing from repo: $REPO, branch: $BRANCH"
        ${{ inputs.cmd }} create sandbox \
          --package-manager ${{ inputs.package-manager }} \
          --template gh:${REPO}/${{ inputs.template }}#${BRANCH}
        cd sandbox
        ${{ inputs.package-manager }} install
        npm run ci
      shell: bash
