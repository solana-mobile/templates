name: 'Setup Environment'
description: 'Sets up the environment for testing by installing dependencies and configuring git.'
inputs:
  node-version:
    description: 'The Node.js version to use.'
    required: true
  package-manager:
    description: 'The package manager to use.'
    required: true
  solana-version:
    description: 'The Solana CLI version to install. Keep in sync with the templates that pin [toolchain] solana_version.'
    default: '3.1.10'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: stable

    - name: Cache Cargo and AVM
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ~/.avm/
        key: ${{ runner.os }}-cargo-avm-1.1.2

    - name: Install AVM
      run: |
        if ! command -v avm &> /dev/null; then
          cargo install --git https://github.com/otter-sec/anchor --tag v1.1.2 avm --locked --force
        fi
      shell: bash

    - name: Install Anchor via AVM
      run: |
        avm install 1.1.2
        avm use 1.1.2
        echo "$HOME/.avm/bin" >> $GITHUB_PATH
      shell: bash

    - name: Cache Solana CLI
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/solana/
          ~/.local/share/solana/
        key: solana-cli-${{ runner.os }}-${{ inputs.solana-version }}

    - name: Install Solana CLI
      env:
        SOLANA_VERSION: ${{ inputs.solana-version }}
      run: |
        sh -c "$(curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install")"
        echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      shell: bash

    # `anchor` resolves a Solana version through avm on every invocation and activates it globally,
    # so this runs in a throwaway workspace pinning the version installed above. Unpinned, it would
    # resolve whatever avm recommends for this Anchor version and leave that active for the rest of
    # the job. avm needs `agave-install` on PATH, so this cannot run before the install step.
    - name: Verify Anchor
      env:
        SOLANA_VERSION: ${{ inputs.solana-version }}
      run: |
        DIR=$(mktemp -d)
        printf '[toolchain]\nsolana_version = "%s"\n' "$SOLANA_VERSION" > "$DIR/Anchor.toml"
        cd "$DIR"
        anchor --version
      shell: bash

    # Assert rather than print: this step only echoed the version, so a mismatch between what was
    # installed and what ended up active passed silently.
    - name: Verify the Solana CLI
      env:
        SOLANA_VERSION: ${{ inputs.solana-version }}
      run: |
        ACTUAL=$(solana --version)
        echo "$ACTUAL"
        case "$ACTUAL" in
          "solana-cli $SOLANA_VERSION "*) ;;
          *) echo "::error::Expected Solana CLI $SOLANA_VERSION, got: $ACTUAL"; exit 1 ;;
        esac
      shell: bash

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure Git identity
      run: |
        git config --global user.email "ci-bot@example.com"
        git config --global user.name "CI Bot"
      shell: bash

    - name: Install package manager
      if: ${{  inputs.package-manager != 'npm' }}
      run: npm install -g ${{ inputs.package-manager }}
      shell: bash
